<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>טופס פתיחת מיניסייט ומוצרים | הילה</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>:root{--primary:#004994;--primary-light:#006cdb;--primary-dark:#002347;--green:#3f7621;--green-light:#7cce50;--green-dark:#33601b;
--bg:#f2f5f9;--card:#fff;--ink:#14233a;--mute:#5d6b7e;--line:#dbe3ee;--soft:#eaf1fa;--err:#c0262d;--errbg:#fdecec;--warn:#9a6700;--warnbg:#fff4d6;--ok:#2d7a1f;--okbg:#e6f4e1;--r:14px}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Assistant,Arial,sans-serif;font-size:16px;line-height:1.5;direction:rtl}
button,input,select,textarea{font:inherit;color:inherit}
.top{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
.top .in{max-width:1240px;margin:auto;padding:10px 20px;display:flex;align-items:center;gap:16px}
.top img{height:30px;display:block}
.top .sep{width:1px;height:26px;background:var(--line)}
.top .ttl{font-weight:800;color:var(--primary);font-size:18px}
.top .sp{flex:1}
.saved{font-size:13px;color:var(--mute);display:flex;align-items:center;gap:6px}
.saved i{width:8px;height:8px;border-radius:50%;background:var(--green-light);display:inline-block}
.stripe{background:var(--primary);color:#fff;text-align:center;padding:7px 16px;font-size:14px}
.wrap{max-width:1240px;margin:22px auto 80px;padding:0 20px;display:grid;grid-template-columns:250px minmax(0,1fr) 330px;gap:22px;align-items:start}
@media(max-width:1100px){.wrap{grid-template-columns:230px minmax(0,1fr)}.aside{display:none}}
@media(max-width:760px){.wrap{grid-template-columns:1fr;margin-top:12px}.nav{position:static!important}}
.nav{position:sticky;top:76px;background:var(--card);border-radius:var(--r);padding:14px;border:1px solid var(--line)}
.nav h4{margin:2px 6px 10px;font-size:13px;color:var(--mute);font-weight:700;letter-spacing:.3px}
.nav button{width:100%;display:flex;align-items:center;gap:10px;text-align:right;background:none;border:0;padding:10px 8px;border-radius:10px;cursor:pointer;font-weight:600;color:var(--ink)}
.nav button:hover{background:var(--soft)}
.nav button.on{background:var(--soft);color:var(--primary)}
.nav .n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:800;background:#e5ebf3;color:var(--mute);flex:none}
.nav .on .n{background:var(--primary);color:#fff}
.nav .done .n{background:var(--green);color:#fff}
.nav .bad .n{background:var(--err);color:#fff}
.nav .meter{margin:12px 6px 4px;font-size:13px;color:var(--mute)}
.bar{height:8px;background:#e5ebf3;border-radius:6px;overflow:hidden;margin-top:6px}
.bar b{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--green-light));width:0;transition:width .3s}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:26px 28px;margin-bottom:18px}
.card h2{margin:0 0 4px;font-size:24px;color:var(--primary-dark)}
.card h3{margin:26px 0 10px;font-size:18px;color:var(--primary);padding-top:18px;border-top:1px dashed var(--line)}
.card h3:first-of-type{border-top:0;padding-top:0;margin-top:18px}
.lead{color:var(--mute);margin:0 0 6px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 20px}
.grid.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.grid .full{grid-column:1/-1}
@media(max-width:640px){.grid,.grid.g3{grid-template-columns:1fr}}
.f label.l{display:block;font-weight:700;margin-bottom:5px}
.f label.l .rq{color:var(--err);margin-inline-start:3px}
.f .hint{font-size:13px;color:var(--mute);margin-top:4px}
.f input[type=text],.f input[type=email],.f input[type=tel],.f input[type=number],.f input[type=date],.f select,.f textarea{width:100%;padding:11px 12px;border:1.5px solid #c5d1e0;border-radius:10px;background:#fff;transition:border .15s,box-shadow .15s}
.f textarea{min-height:92px;resize:vertical}
.f input:focus,.f select:focus,.f textarea:focus{outline:0;border-color:var(--primary-light);box-shadow:0 0 0 3px rgba(0,108,219,.15)}
.f.invalid input,.f.invalid select,.f.invalid textarea,.f.invalid .opts{border-color:var(--err);background:#fffafa}
.f .err{display:none;color:var(--err);font-size:13px;margin-top:4px;font-weight:600}
.f.invalid .err{display:block}
.ltr{direction:ltr;text-align:left}
.suffix{position:relative}
.suffix input{padding-inline-end:46px!important}
.suffix span{position:absolute;inset-inline-end:12px;top:50%;transform:translateY(-50%);color:var(--mute);font-size:14px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{position:relative}
.opt input{position:absolute;opacity:0;inset:0;cursor:pointer}
.opt span{display:block;padding:9px 14px;border:1.5px solid #c5d1e0;border-radius:999px;background:#fff;cursor:pointer;font-weight:600;transition:all .12s}
.opt input:checked+span{background:var(--primary);border-color:var(--primary);color:#fff}
.opt input:focus-visible+span{box-shadow:0 0 0 3px rgba(0,108,219,.3)}
.opts.stack{flex-direction:column;gap:8px}
.opts.stack .opt span{border-radius:12px;padding:11px 14px}
.opt small{display:block;font-weight:400;opacity:.85}
.chk{display:flex;gap:10px;align-items:flex-start;cursor:pointer;padding:10px 12px;border:1.5px solid #c5d1e0;border-radius:12px;background:#fff}
.chk input{margin-top:4px;accent-color:var(--primary);width:18px;height:18px;flex:none}
.chk b{display:block}
.chk small{color:var(--mute)}
.f.invalid .chk{border-color:var(--err)}
.note{border-radius:12px;padding:12px 14px;margin:12px 0;font-size:14.5px;background:var(--soft);color:var(--primary-dark);border:1px solid #cfe0f5}
.note.warn{background:var(--warnbg);border-color:#f0dc9a;color:#5d4200}
.note.ok{background:var(--okbg);border-color:#bfe0b6;color:#1d5412}
.note.bad{background:var(--errbg);border-color:#f2b9bb;color:#7d1319}
.btn{border:0;border-radius:12px;padding:12px 22px;font-weight:800;cursor:pointer;font-size:16px}
.btn.pri{background:var(--green);color:#fff}
.btn.pri:hover{background:var(--green-dark)}
.btn.sec{background:#fff;border:1.5px solid var(--primary);color:var(--primary)}
.btn.sec:hover{background:var(--soft)}
.btn.ghost{background:none;color:var(--primary);padding:8px 10px}
.btn.sm{padding:7px 12px;font-size:14px;border-radius:9px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.actions{display:flex;justify-content:space-between;gap:12px;margin-top:6px;flex-wrap:wrap}
.ptabs{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.ptab{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:8px 14px;cursor:pointer;font-weight:700;display:flex;gap:8px;align-items:center}
.ptab.on{border-color:var(--primary);background:var(--soft);color:var(--primary)}
.ptab i{width:9px;height:9px;border-radius:50%;background:#c5d1e0}
.ptab i.ok{background:var(--green)}
.ptab i.bad{background:var(--err)}
table.comps{width:100%;border-collapse:collapse;font-size:15px}
.comps th{text-align:right;font-size:13px;color:var(--mute);padding:6px 8px;border-bottom:2px solid var(--line)}
.comps td{padding:7px 8px;border-bottom:1px solid #edf1f6;vertical-align:middle}
.comps tr.off td{opacity:.55}
.comps input[type=number]{width:110px;padding:8px 10px;border:1.5px solid #c5d1e0;border-radius:9px}
.comps .tag{font-size:12px;background:#eef3f9;border-radius:6px;padding:1px 7px;color:var(--mute);white-space:nowrap}
.comps tr.bad input[type=number]{border-color:var(--err)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
.tog{position:relative;width:44px;height:26px;display:inline-block}
.tog input{opacity:0;position:absolute;inset:0;cursor:pointer;z-index:2}
.tog i{position:absolute;inset:0;background:#c5d1e0;border-radius:20px;transition:.15s}
.tog i:after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:20px;height:20px;background:#fff;border-radius:50%;transition:.15s}
.tog input:checked+i{background:var(--green)}
.tog input:checked+i:after{inset-inline-start:21px}
.rowcard{border:1px solid var(--line);border-radius:12px;padding:14px;background:#fafcff;margin-bottom:10px}
.drop{display:block;border:2px dashed #aebfd6;border-radius:14px;padding:22px;text-align:center;background:#fafcff;cursor:pointer;transition:.15s}
.drop:hover,.drop.over{border-color:var(--primary-light);background:var(--soft)}
.drop b{color:var(--primary)}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-top:12px}
.th{position:relative;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.th img{width:100%;height:92px;object-fit:cover;display:block}
.th .m{font-size:12px;padding:5px 7px;color:var(--mute)}
.th .m b{color:var(--ink)}
.th.bad{border-color:var(--err)}
.th .x{position:absolute;top:4px;inset-inline-start:4px;background:rgba(0,0,0,.6);color:#fff;border:0;border-radius:50%;width:24px;height:24px;cursor:pointer}
.th .badge{position:absolute;top:4px;inset-inline-end:4px;background:var(--primary);color:#fff;font-size:11px;font-weight:800;border-radius:6px;padding:1px 6px}
.th .e{font-size:12px;color:var(--err);padding:0 7px 6px;font-weight:700}
.aside{position:sticky;top:76px;display:flex;flex-direction:column;gap:16px}
.pv{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.pv h5{margin:0;padding:10px 14px;font-size:13px;color:var(--mute);background:#f7f9fc;border-bottom:1px solid var(--line)}
.pvh{padding:10px 12px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line);background:#fff;min-height:52px}
.pvh img{height:22px}
.pvh .og{height:26px;max-width:90px;object-fit:contain}
.pvh .ph{width:70px;height:24px;border:1.5px dashed #b8c6d8;border-radius:6px;font-size:10px;color:var(--mute);display:grid;place-items:center}
.pvb{background:var(--primary);color:#fff;font-size:12px;padding:6px 12px}
.tile{margin:12px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;box-shadow:0 4px 14px rgba(0,35,71,.07)}
.tile .im{height:120px;background:linear-gradient(135deg,#cfe0f5,#eaf1fa);background-size:cover;background-position:center;display:grid;place-items:center;color:var(--mute);font-size:13px}
.tile .bd{padding:10px 12px;background:var(--primary);color:#fff}
.tile .bd b{display:block;font-size:16px}
.tile .bd span{font-size:12.5px;opacity:.9}
.tile .pr{background:#fff;padding:9px 12px;display:flex;justify-content:space-between;align-items:center;color:var(--ink)}
.tile .pr strong{color:var(--green);font-size:18px}
.tile .pr small{color:var(--mute);font-size:12px}
.sum h4{margin:18px 0 8px;color:var(--primary)}
.kv{display:grid;grid-template-columns:200px 1fr;gap:6px 14px;font-size:15px}
.kv dt{color:var(--mute)}
.kv dd{margin:0;font-weight:600;word-break:break-word}
@media(max-width:640px){.kv{grid-template-columns:1fr}}
.issues li{margin:6px 0}
.issues a{color:var(--primary);cursor:pointer;text-decoration:underline;font-weight:700}
pre.code{direction:ltr;text-align:left;background:#0e1b2e;color:#d8e6ff;padding:14px;border-radius:12px;overflow:auto;max-height:420px;font-size:12.5px}
.tabs{display:flex;gap:6px;margin:6px 0 12px;flex-wrap:wrap}
.tabs button{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:7px 14px;cursor:pointer;font-weight:700}
.tabs button.on{background:var(--primary);border-color:var(--primary);color:#fff}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:800}
.pill.ok{background:var(--okbg);color:var(--ok)}.pill.bad{background:var(--errbg);color:var(--err)}.pill.warn{background:var(--warnbg);color:var(--warn)}
.toast{position:fixed;bottom:22px;inset-inline:0;margin:auto;width:max-content;max-width:90vw;background:var(--primary-dark);color:#fff;padding:12px 20px;border-radius:12px;z-index:60;box-shadow:0 8px 30px rgba(0,0,0,.25)}
.hide{display:none!important}
.sticky-actions{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 30%);padding:18px 0 6px}
@media print{.top,.stripe,.nav,.aside,.actions,.sticky-actions,.tabs,.nodev{display:none!important}.wrap{display:block}.card{border:0;padding:0}}
@media(max-width:760px){
.top .in{padding:8px 12px;gap:10px}.top .ttl,.top .sep,.saved{display:none}.top img{height:24px}
.stripe{font-size:12.5px;padding:6px 12px}
.wrap{padding:0 12px;gap:12px}
.nav{display:flex;flex-wrap:nowrap;overflow-x:auto;gap:4px;padding:8px;position:sticky!important;top:46px;z-index:20}
.nav h4,.nav .meter{display:none}
.nav button{width:auto;flex:none;padding:6px}
.nav button span:last-child{display:none}
.nav button.on span:last-child{display:inline;font-size:14px}
.nav button.on span:last-child small{display:none}
.card{padding:18px 14px}
.card h2{font-size:21px}
.ptab{padding:7px 10px;font-size:14px}
.sticky-actions .btn{padding:11px 16px}
}
@media(max-width:760px){.comps th:nth-child(4),.comps td:nth-child(4){display:none}.comps td:nth-child(2){min-width:150px}.comps input[type=number]{width:90px}}
</style></head><body>

const dmy = s => { if (!s) return ''; const [y, m, d] = s.split('-'); return `${d}/${m}/${y}`; };

function autoShort(p) {

function infoLines(p) {
  const L = []; const b = (BOARD.find(x => x[0] === p.board) || [])[1]; const n = nights(p);
  const top = [], more = [];
  if (p.lines.subsidy) top.push('המחירים לאחר סבסוד.');

  return { top: top.filter(Boolean), more };

}

function validate() {

  if (!isoOk(R.goLive)) E(0, 'req.goLive', 'חסר תאריך עלייה לאוויר רצוי');
  else if (new Date(R.goLive) < new Date(new Date().toDateString())) E(0, 'req.goLive', 'התאריך כבר עבר', null, 'warn');

  if (!O.name.trim()) E(1, 'org.name', 'חסר שם הארגון');

  if (!/^[A-Za-z0-9]{18}$/.test(O.accountId)) E(1, 'org.accountId', 'מזהה CRM חייב להיות בדיוק 18 תווים (אותיות לטיניות וספרות). נמצא ב-Account ב-CRM');
  if (!/^\d{3,8}$/.test(O.priority)) E(1, 'org.priority', 'קוד Priority חייב להיות מספר (3-8 ספרות)');
  if (!O.segment) E(1, 'org.segment', 'יש לבחור סוג אתר');
  if (!O.contactName.trim()) E(1, 'org.contactName', 'חסר איש קשר בארגון');

  if (!O.crmCreated) E(1, 'org.crmCreated', 'יש לאשר שנוצרה רשומת Account_Membership ב-CRM');
  if (!(num(O.eligibleCount) >= 1)) E(1, 'org.eligibleCount', 'חסרה הערכת מספר עובדים זכאים');
  if (!O.logo) E(1, 'org.logo', 'חסר לוגו הארגון');
  else if (O.logo.err) E(1, 'org.logo', O.logo.err);
  if (!O.look) E(1, 'org.look', 'יש לבחור מראה לאתר');
  if (O.look === 'custom') {
    if (!O.banner) E(1, 'org.banner', 'חסר באנר לעמוד ההשתלמויות');
    if (!O.slider.length) E(1, 'org.slider', 'חסרה לפחות תמונת סליידר אחת');
    if (!O.footer.trim()) E(1, 'org.footer', 'חסר טקסט לתחתית האתר');
  }
  if (!O.menu) E(1, 'org.menu', 'יש לבחור סוג תפריט');

  S.products.forEach((p, i) => {
    const P = (step, path, msg, level) => E(step, 'p.' + path, msg, i, level);
    if (p.type === 'course') {
      const c = p.co;
      if (!c.name.trim()) P(2, 'co.name', 'חסר שם הקורס');
      if (!c.inst) P(2, 'co.inst', 'חסר מוסד לימודים');

      if (!c.cat) P(2, 'co.cat', 'חסרה קטגוריה');
      if (c.campaign.trim().length !== 18) P(2, 'co.campaign', 'מזהה קמפיין CRM בן 18 תווים (מתחיל ב-701)');
      if (num(c.price) === null || num(c.price) < 0) P(3, 'co.price', 'חסר מחיר (0 מותר לקורס שמשאיר פרטים)');
      if (!p.tax) P(4, 'tax', 'יש לבחור מע״מ');

function fld({ path, label, hint = '', type = 'text', ph = '', req = true, opts, ltr = false, rows, suffix, full = false, rerender = false, min, max, cls = '' }) {
  const v = getp(path); const id = 'f_' + path.replace(/\W/g, '_');
  let inner = '';
  const rq = req ? '<span class="rq">*</span>' : '<span style="color:var(--mute);font-weight:400"> (רשות)</span>';
  const rr = rerender ? ' data-rr="1"' : '';
  if (type === 'select') inner = `<select id="${id}" data-path="${path}"${rr}><option value="">בחרי…</option>${opts.map(o => `<option value="${esc(o[0])}"${v === o[0] ? ' selected' : ''}>${esc(o[1])}</option>`).join('')}</select>`;
  else if (type === 'radio') inner = `<div class="opts ${opts.length > 3 || opts.some(o => o[2]) ? 'stack' : ''}">${opts.map(o => `<label class="opt"><input type="radio" name="${id}" data-path="${path}" value="${esc(o[0])}"${v === o[0] ? ' checked' : ''}${rr}><span>${esc(o[1])}${o[2] ? `<small>${esc(o[2])}</small>` : ''}</span></label>`).join('')}</div>`;
  else if (type === 'textarea') inner = `<textarea id="${id}" data-path="${path}" rows="${rows || 3}" placeholder="${esc(ph)}">${esc(v)}</textarea>`;
  else {
    const inp = `<input id="${id}" type="${type}" data-path="${path}" value="${esc(v)}" placeholder="${esc(ph)}"${min != null ? ` min="${min}"` : ''}${max != null ? ` max="${max}"` : ''}${type === 'number' ? ' inputmode="decimal" step="any"' : ''}${ltr ? ' class="ltr"' : ''}${rr}>`;
    inner = suffix ? `<div class="suffix">${inp}<span>${suffix}</span></div>` : inp;
  }
  return `<div class="f ${full ? 'full' : ''} ${cls}" data-fp="${path}"><label class="l" for="${id}">${label}${rq}</label>${inner}${hint ? `<div class="hint">${hint}</div>` : ''}<div class="err"></div></div>`;
}
function chk({ path, title, sub = '', rerender = false, full = true }) {

    return {

function textSummary() {

  S.products.forEach((p, i) => {

    if (p.type !== 'course') {
      L.push(`  מלון: ${p.hotelName}, ${p.city} · ${dmy(p.start)} - ${dmy(p.end)} (${nights(p)} לילות) · ${(BOARD.find(b => b[0] === p.board) || [])[1] || ''}`);

const SCR = [scReq, scOrg, scStay, scComp, scTerms, scMedia, scReview];
function render(keepScroll) {
  V = validate();
  const y = window.scrollY;
  const total = V.filter(x => x.level === 'error').length;
  const fieldsAll = 36 * S.products.length;
  const pct = Math.max(4, Math.min(100, Math.round((1 - total / Math.max(total + 40, fieldsAll)) * 100)));
  $('#nav').innerHTML = `<h4>השלבים</h4>` + STEPS.map((s, i) => {
    const e = i < 6 ? (i < 2 ? errCount(i) : S.products.reduce((a, _, pi) => a + errCount(i, pi), 0)) : total;
    const st = i === S.step ? 'on' : (i < 6 && e === 0 && S.attempted[i] ? 'done' : (i < 6 && e && S.attempted[i] ? 'bad' : ''));
    return `<button class="${st}" data-act="step" data-i="${i}"><span class="n">${st === 'done' ? '✓' : i + 1}</span><span>${s[1]}<br><small style="color:var(--mute);font-weight:400">${s[2]}</small></span></button>`;
  }).join('') + `<div class="meter">${total ? `חסרים ${total} פרטים` : 'הכל מלא ✓'}<div class="bar"><b style="width:${pct}%"></b></div></div>`;
  const nxt = S.step < 6 ? `<div class="sticky-actions nodev"><div class="actions">${S.step > 0 ? '<button class="btn sec" data-act="back">חזרה</button>' : '<span></span>'}<button class="btn pri" data-act="next">${S.step === 5 ? 'לסקירה ושליחה' : 'המשך'}</button></div></div>` : '<div class="actions" style="margin-top:6px"><button class="btn sec" data-act="back">חזרה לעריכה</button></div>';
  $('#main').innerHTML = SCR[S.step]() + nxt;
  $('#aside').innerHTML = S.step === 6 ? '' : preview();
  $('#aside').parentElement.classList.toggle('noaside', S.step === 6);
  bindAfter(); markErrors(); updateInfo();
  if (keepScroll) window.scrollTo(0, y);
  save();
}
function markErrors() {
  $$('.f[data-fp]').forEach(el => {
    const path = el.dataset.fp; const pi = path.startsWith('p.') ? S.cur : null;
    const hits = V.filter(x => x.step === S.step && x.path === path && (x.pi == null || x.pi === pi || pi == null));
    const prefix = V.filter(x => x.step === S.step && x.path.startsWith(path + '.') && (x.pi == null || x.pi === pi));
    const all = hits.concat(path === 'p.images' || path === 'p.comps' ? prefix : []);
    const show = all.length && (S.attempted[S.step] || S.touched[path]);
    el.classList.toggle('invalid', !!show);
    const e = $('.err', el); if (e) e.textContent = show ? all[0].msg : '';
  });
}
function updateInfo() {
  const el = $('#infoPreview'); if (!el) return; const p = cp(); const il = infoLines(p);
  el.innerHTML = '<b>כך זה יופיע בעמוד המוצר:</b><br>' + (il.top.length ? '<b>שימו לב:</b><br>' + il.top.map(x => '✔ ' + esc(x)).join('<br>') : '') + (il.more.length ? '<br><b>מידע נוסף:</b><br>' + il.more.map(x => '✔ ' + esc(x)).join('<br>') : '');
}
function softUpdate() { /* בלי רינדור מחדש: מעדכן סטטוס, תצוגה מקדימה ושגיאות */
  V = validate(); const p = cp();
  if (p.titleAuto) { p.title = autoTitle(p); const t = $('[data-path="p.title"]'); if (t) t.value = p.title; }
  if (p.shortAuto) { p.shortDesc = autoShort(p); const t = $('[data-path="p.shortDesc"]'); if (t) t.value = p.shortDesc; }
  if (p.type !== 'course' && !p.closesAt && p.start) { p.closesAt = p.start; const t = $('[data-path="p.closesAt"]'); if (t) t.value = p.closesAt; }
  V = validate(); markErrors(); updateInfo();
  if (S.step !== 6) $('#aside').innerHTML = preview();
  const total = V.filter(x => x.level === 'error').length; const m = $('.nav .meter'); if (m) m.firstChild.textContent = total ? `חסרים ${total} פרטים` : 'הכל מלא ✓';

}

/* ---------- אירועים ---------- */
function bindAfter() {
  $$('[data-file]').forEach(inp => inp.addEventListener('change', () => handleFiles(inp.dataset.file, inp.files)));
  $$('[data-drop]').forEach(d => {
    ['dragover', 'dragenter'].forEach(e => d.addEventListener(e, ev => { ev.preventDefault(); d.classList.add('over'); }));
    ['dragleave', 'drop'].forEach(e => d.addEventListener(e, ev => { ev.preventDefault(); d.classList.remove('over'); }));
    d.addEventListener('drop', ev => handleFiles(d.dataset.drop, ev.dataTransfer.files));
  });
}
document.addEventListener('input', e => {

    setp(t.dataset.path, v);
    if (t.dataset.path === 'p.title') cp().titleAuto = false; if (t.dataset.path === 'p.shortDesc') cp().shortAuto = false;
    if (t.dataset.path.startsWith('p.') || t.dataset.path.startsWith('org.')) { if (t.type === 'radio' || t.type === 'checkbox' || t.tagName === 'SELECT') S.touched[t.dataset.path] = true; }

/* ---------- קבצי תמונה ---------- */
async function inspect(file, kind) {

  const isPng = buf[0] === 0x89 && buf[1] === 0x50 && buf[2] === 0x4E;
  const tag = String.fromCharCode(...buf.slice(4, 12));
  const isAvif = tag.startsWith('ftypavif') || tag.startsWith('ftypavis'), isWebp = String.fromCharCode(...buf.slice(0, 4)) === 'RIFF' && String.fromCharCode(...buf.slice(8, 12)) === 'WEBP';
  const full = await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.onerror = () => r(''); fr.readAsDataURL(file); });
  let url = '', dim = [0, 0];
  await new Promise(r => { const im = new Image(); im.onload = () => { dim = [im.naturalWidth, im.naturalHeight]; const k = Math.min(1, 360 / im.naturalWidth); const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(im.naturalWidth * k)); c.height = Math.max(1, Math.round(im.naturalHeight * k)); c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); url = kind === 'logo' ? c.toDataURL('image/png') : c.toDataURL('image/jpeg', 0.8); r(); }; im.onerror = () => r(); im.src = full; });
  let err = '';
  if (isAvif) err = 'זה קובץ AVIF בשם JPG. יש לשמור מחדש כ-JPEG אמיתי';
  else if (isWebp) err = 'זה קובץ WebP. יש להמיר ל-JPEG';
  else if (kind === 'logo') { if (!isPng) err = 'הלוגו חייב להיות PNG'; else if (dim[1] < 48) err = 'הלוגו קטן מדי (גובה 64 פיקסלים ומעלה)'; }
  else if (!isJpg && !isPng) err = 'פורמט לא נתמך. יש להעלות JPEG';
  else if (kind === 'gallery' && dim[0] < 1000) err = `רחבה רק ${dim[0]} פיקסלים, נדרש 1000 ומעלה`;
  else if (kind === 'banner' && dim[0] < 1200) err = 'הבאנר צריך להיות ברוחב 1440 פיקסלים';
  else if (kind === 'slider' && dim[0] < 1200) err = 'הסליידר צריך להיות ברוחב 1440 פיקסלים לפחות';
  if (!dim[0]) err = 'לא ניתן לקרוא את הקובץ כתמונה';

async function handleFiles(key, files) {

  else if (key === 'slider') { for (const f of list) S.org.slider.push(await inspect(f, 'slider')); }
  else { S.org[key] = await inspect(list[0], key); }

}
